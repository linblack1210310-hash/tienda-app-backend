<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiendaApp - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 id="form-title">Iniciar Sesión</h2>
        
        <form id="auth-form">
            <div class="input-group">
                <label for="user">Usuario o Email</label>
                <input type="text" id="user" required placeholder="admin o cliente1">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="admin123 o 123">
            </div>

            <button type="submit" id="submit-btn">Entrar</button>
        </form>

        <p class="toggle-text">
            <span id="toggle-msg">¿No tienes cuenta?</span>
            <a href="#" id="toggle-link">Regístrate aquí</a>
        </p>

        <div id="message" class="message hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
