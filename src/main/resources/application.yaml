spring:
  application:
    name: tienda
  
  datasource:
    url: jdbc:mysql://localhost:3306/tienda_db?createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # Esto crea las tablas solas
    show-sql: true

server:
  port: ${PORT:9090}
  servlet:
    context-path: /api/v1/tienda

security:
  jwt:
    secret-key: estaEsUnaClaveSecretaMuyLargaParaElProyectoDeTienda2026
    token-expiration: 600000